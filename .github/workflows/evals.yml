name: Evaluation gates

on:
  workflow_dispatch:
    inputs:
      run_promptfoo:
        description: Run the Promptfoo grounded-answer gate
        type: boolean
        default: true
      run_ragas:
        description: Run the Ragas memory/answer gate
        type: boolean
        default: true
      run_deepeval:
        description: Run the DeepEval answer-quality gate
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MACHINA_EVAL_MODEL: ${{ vars.MACHINA_EVAL_MODEL || 'gpt-4.1-mini' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Set up Node.js 24 for Promptfoo
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r internal/evals/requirements.txt

      - name: Refuse to run without a model credential
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is required for generation-quality gates." >&2
            exit 2
          fi

      - name: Promptfoo grounded-answer gate
        if: ${{ inputs.run_promptfoo }}
        run: |
          npx --yes promptfoo@latest eval -c internal/evals/promptfooconfig.yaml --no-progress-bar

      - name: Ragas metric gate
        if: ${{ inputs.run_ragas }}
        run: python internal/evals/ragas_gate.py --baseline internal/evals/ragas_baseline.json

      - name: DeepEval answer-quality gate
        if: ${{ inputs.run_deepeval }}
        run: python -m deepeval test run internal/evals/test_agent.py
