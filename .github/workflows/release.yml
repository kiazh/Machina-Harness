name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v2.0.0)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-and-attest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install locked build and runtime dependencies
        run: |
          python -m pip install --upgrade pip "uv==0.11.7"
          uv export --frozen --extra dev --group build --no-hashes --no-emit-project -o /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt

      - name: Verify the tag matches the package version
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import sys
          import tomllib

          tag = os.environ["TAG"].lstrip("v")
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = project["project"]["version"]
          init = pathlib.Path("machina/__init__.py").read_text(encoding="utf-8")
          problems = []
          if tag != version:
              problems.append(f"tag {os.environ['TAG']!r} != pyproject version {version!r}")
          if f'__version__ = "{version}"' not in init and f"__version__ = '{version}'" not in init:
              problems.append("machina/__init__.py does not declare the pyproject version")
          if problems:
              sys.exit("; ".join(problems))
          print(f"release version {version} matches the tag")
          PY

      - name: Run the repository smoke suite
        run: python -m pytest tests -q -p no:cacheprovider

      - name: Build wheel and source distribution
        run: |
          python -m hatchling build

      - name: Verify release artifacts
        run: python tools/check_release_artifacts.py dist/*

      - name: Generate CycloneDX SBOM
        run: python tools/generate_sbom.py --output dist/sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
        with:
          cosign-release: "v2.4.1"

      - name: Sign every release artifact with keyless Sigstore
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            cosign sign-blob --yes --bundle "${artifact}.sigstore.json" "${artifact}"
          done

      - name: Attest SLSA build provenance
        uses: actions/attest-build-provenance@7668571508540a607bdfd90a87a560489fe372eb # v2.1.0
        with:
          subject-path: "dist/*"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            :
          elif [ -f "internal/docs/verification/RELEASE_${TAG#v}.md" ]; then
            gh release create "$TAG" --title "Machina $TAG" \
              --notes-file "internal/docs/verification/RELEASE_${TAG#v}.md"
          else
            gh release create "$TAG" --generate-notes --title "Machina $TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
