name: Rune desktop release

on:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

concurrency:
  group: rune-desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create the release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --title "Deus Ex Machina $GITHUB_REF_NAME" \
              --generate-notes

  build:
    needs: prepare
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      RUSTUP_TOOLCHAIN: "1.99.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Build the native executable
        run: cargo build --release --locked --manifest-path apps/desktop/Cargo.toml
      - name: Package the Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "machina-desktop-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path apps/desktop/target/release/machina-desktop.exe -DestinationPath $asset
          gh release upload "$env:GITHUB_REF_NAME" $asset --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Package the macOS executable
        if: runner.os == 'macOS'
        run: |
          asset="machina-desktop-${GITHUB_REF_NAME}-macos.tar.gz"
          tar -czf "$asset" -C apps/desktop/target/release machina-desktop
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
